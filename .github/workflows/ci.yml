name: Sentinel-VL CI & Release Gate

on:
  push:
    branches: [ main, main-win ]
  pull_request:
    branches: [ main, main-win ]

jobs:
  test:
    name: Clean Checkout, Install & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (ffmpeg & ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build wheel pytest pytest-cov

      - name: Build wheel package
        run: |
          python -m build --wheel

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl

      - name: Test CLI entrypoint outside repository
        run: |
          cd /tmp
          sentinel-vl --help
          sentinel-vl status

      - name: Install dev and optional dependencies for full test suite
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[app,dev]"

      - name: Execute complete test suite
        run: |
          pytest -v --durations=10
